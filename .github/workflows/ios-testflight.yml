# Builds the iOS app on GitHub's Mac and uploads it to TestFlight (no Mac needed at BIRCO).
# Run it by hand (Actions > "iOS to TestFlight" > Run workflow), by pushing a tag like ios-1.0.0-2,
# or by changing app/ios/RELEASE on the store apps branch.
# Needs these repository secrets (App Store Connect > Users and Access > Integrations > App Store Connect API):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file contents), APPLE_TEAM_ID
name: iOS to TestFlight
on:
  push:
    tags: ['ios-*']
    branches: [claude/project-thread-9p5ix3]
    paths: [app/ios/RELEASE]
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      # Issuer and team ids are not secret; the fallbacks are BIRCO's
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '0327ee2c-9dea-4997-a752-35c5ebbb6162' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '4Y9KCBG4Y8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          # Pasted from Windows Notepad: drop carriage returns, and rebuild the PEM lines if they were flattened
          body=$(printf '%s' "$P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo '-----BEGIN PRIVATE KEY-----'; echo "$body" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "key body chars: ${#body}, key lines: $(wc -l < ~/private_keys/AuthKey_$ASC_KEY_ID.p8), issuer set: $([ -n "$ASC_ISSUER_ID" ] && echo yes || echo no)"
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/out -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
